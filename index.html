<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hello, World</h1>

        <p class="subtitle">My first website built with Claude Code</p>

        <p>This is a simple, clean website that demonstrates the fundamentals of web development. It uses HTML for structure, CSS for styling, and JavaScript for interactivity.</p>

        <div class="card">
            <p>You've clicked the counter <span id="counter">0</span> times.</p>
            <button id="clickBtn">Click here</button>
        </div>

        <div class="info">
            <p>Built with HTML, CSS, and JavaScript.</p>
            <p class="date" id="date"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
